# 0 is too far away
set -g base-index 1

# best choice 
set-option -g default-shell /bin/zsh

# set terminal colors
set -g default-terminal "screen-256color"

# remove delay
set-option -sg repeat-time 0
set -sg escape-time 0

# vi mode
setw -g mode-keys vi

# copy mode
# Copy: enter copy mode with C-W+[ and then move around like in vim
# Paste: Paste with C-W+]
# exit copy mode with q/Esc
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# remap prefix from 'C-b' to 'Escape'
set-option -g prefix C-W
bind-key C-W send-prefix
unbind C-b

#splitting panes using '|' and '-'
unbind '"'
unbind %
unbind t
bind-key | split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'

# Switching window
unbind .
unbind ,
bind-key , previous-window
bind-key . next-window


# Renaming window and session
unbind r
bind-key r command-prompt -p "New window name:" "rename-window '%1'"
bind-key R command-prompt -p "New session name:" "rename-session '%1'"

# the keybinding for resizing
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key y resize-pane -y 2
bind-key t resize-pane -y 60

# Selecting panes
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# choose session
unbind /
bind / choose-tree -s

# enable mouse
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

